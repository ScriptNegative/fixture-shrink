<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">FixtureShrink — smaller JSON, clearer bugs</title>
  <desc id="desc">A large JSON fixture passes through a specific failure check to become a smaller reproducible case.</desc>
  <rect width="1200" height="320" rx="24" fill="#0b1214"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#28413e"/>
  <text x="52" y="62" fill="#8fe7c7" font-family="Arial, sans-serif" font-size="16" letter-spacing="3">SMALLER JSON. CLEARER BUGS.</text>
  <text x="50" y="122" fill="#f0faf6" font-family="Arial, sans-serif" font-weight="700" font-size="49">FixtureShrink</text>
  <text x="52" y="165" fill="#b0c5bd" font-family="Arial, sans-serif" font-size="20">Find the input that makes the failure visible.</text>
  <text x="52" y="264" fill="#8ca59a" font-family="Arial, sans-serif" font-size="17">Offline CLI  ·  No dependencies  ·  Agent Skill</text>
  <g transform="translate(680 70)">
    <rect width="135" height="170" rx="12" fill="#172722" stroke="#355348"/>
    <text x="18" y="35" fill="#8fe7c7" font-family="monospace" font-size="19">{</text>
    <path d="M30 53h82m-82 17h65m-65 17h78m-78 17h55m-55 17h82m-82 17h60" stroke="#526d60" stroke-width="5" stroke-linecap="round"/>
    <text x="18" y="160" fill="#8fe7c7" font-family="monospace" font-size="19">}</text>
    <path d="M155 85h45m-9-8 9 8-9 8" stroke="#8fe7c7" stroke-width="3" fill="none"/>
    <rect x="214" y="30" width="80" height="112" rx="12" fill="#193c30" stroke="#8fe7c7"/>
    <text x="232" y="63" fill="#b8ffdf" font-family="monospace" font-size="19">{</text>
    <path d="M239 82h35m-35 17h27" stroke="#8fe7c7" stroke-width="5" stroke-linecap="round"/>
    <text x="232" y="127" fill="#b8ffdf" font-family="monospace" font-size="19">}</text>
    <text x="153" y="199" text-anchor="middle" fill="#b0c5bd" font-family="Arial, sans-serif" font-size="15">Specific failure. Replayed.</text>
  </g>
</svg>
